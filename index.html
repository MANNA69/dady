<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MANNA Trading App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="https://static.deriv.com/logos/deriv-gray.svg" class="deriv-logo" alt="Deriv Logo">
    <h1 id="manna-logo">MANNA</h1>
  </header>

  <main>
    <a href="https://oauth.deriv.com/oauth2/authorize?app_id=72379&affiliate_token=_jCUPKTCOsvmFfUyb_9NCN2Nd7ZgqdRLk" id="login-btn">Login with Deriv</a>
    <div id="account-info"></div>

    <div id="trade-panel" style="display:none;">
      <h2>Trade Setup</h2>
      <label for="symbol">Select Symbol</label>
      <select id="symbol">
        <option value="R_10">Volatility 10</option>
        <option value="R_25">Volatility 25</option>
        <option value="R_50">Volatility 50</option>
        <option value="R_75">Volatility 75</option>
        <option value="R_100">Volatility 100</option>
      </select>

      <label for="contract">Contract Type</label>
      <select id="contract">
        <option value="CALL">Rise</option>
        <option value="PUT">Fall</option>
      </select>

      <label for="duration">Duration (minutes)</label>
      <input type="number" id="duration" value="1"/>

      <label for="stake">Stake Amount ($)</label>
      <input type="number" id="stake" value="1"/>

      <button onclick="placeTrade()">Trade</button>
      <div id="log"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
